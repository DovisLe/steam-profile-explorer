name: Secret scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for Steam API keys in files
        run: |
          files=$(git grep -lE '(^|[^0-9A-Fa-f])[0-9A-Fa-f]{32}([^0-9A-Fa-f]|$)' || true)
          if [ -n "$files" ]; then
            echo "::error::Possible Steam API key in these files (value hidden):"
            echo "$files"
            exit 1
          fi

      - name: Look for Steam API keys in history
        run: |
          count=$(git log --all -p --no-color | grep '^+' |
            grep -cE '(^|[^0-9A-Fa-f])[0-9A-Fa-f]{32}([^0-9A-Fa-f]|$)' || true)
          if [ "$count" -gt 0 ]; then
            echo "::error::$count added line(s) in git history look like a Steam API key. Revoke the key now. See docs/secrets.md."
            exit 1
          fi